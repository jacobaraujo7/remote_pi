  brace-expansion: ^5.0.9
  fast-uri: ^3.1.5
  hono: ^4.12.34
  ip-address: ^10.3.1
  nanoid: ^3.3.18
  postcss: ^8.5.23
  protobufjs: ^7.6.5
  undici: ^8.9.0
  vite: ^8.0.16
  ws: ^8.21.0
