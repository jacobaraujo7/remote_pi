name: cockpit
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.26.0+60

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# Build hook do libghostty. Sem este bloco o hook cai no modo padrão `prebuilt`
# e baixa a dylib da release v0.0.11 (source 91f66da), que NÃO exporta
# `ghostty_terminal_compression_activity`. Como os bindings da branch usada nos
# dependency_overrides já chamam esse símbolo — no construtor do
# TerminalControllerImpl —, todo terminal morria com `dlsym: symbol not found`.
#
# `source: compile` casa a dylib com o `ghostty.version` dos bindings.
# Exige **Zig 0.16.0** na máquina de build (o ghostty declara
# minimum_zig_version 0.16.0; 0.15.x falha). Compile a frio ~30s, depois cacheado.
hooks:
  user_defines:
    libghostty:
      source: compile
      download: tarball

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Parse dos layouts `.ckp` (orquestração de panes) — YAML puro-Dart.
  yaml: ^3.1.2

  # sha256 do trust hash dos hooks do Codex CLI (o Codex só executa hook cujo
  # hash está confiado no config.toml). Já vinha transitivo; virou direta.
  crypto: ^3.0.7

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Migração de UI: design system shadcn (componentes, overlays, tema). Substitui
  # o Material como camada de UI na raiz (`ShadcnApp.router`). Pin exato — pacote
  # pré-1.0 (API churna). Nota: o `ShadcnApp` já injeta
  # `DefaultMaterialLocalizations` (en-US) por padrão, então os widgets de
  # terceiros que embutem Material (xterm, media_kit_video, gpt_markdown)
  # funcionam sem `flutter_localizations`; e `shadcn_flutter.dart` já re-exporta
  # `Icons`, então mantemos os Material Icons sem import extra.
  shadcn_flutter: 0.0.52

  # DI + roteamento + estado page-scoped num pacote só: cada feature é um módulo
  # (`createModule`) que declara suas rotas + binds. Substitui provider +
  # auto_injector + go_router (removidos). Ver `lib/app/` e CLAUDE.md.
  flutter_modular: ^7.1.0

  # Plano 37 — seleção de pasta (NSOpenPanel no macOS) para abrir um projeto.
  file_picker: ^8.1.2

  # Plano 51 — senha de conexão no cofre nativo do SO (Keychain / Credential
  # Manager / Secret Service). Nunca em .cockpit/databases.json.
  flutter_secure_storage: ^9.0.0

  # Persistência local virou JSON puro (JsonStateStore, write-temp+rename
  # atômico) — o Hive fica SÓ pra migração one-shot dos dados legados
  # (core/data/setup/hive_migration.dart é o único import). Remover numa
  # release futura, quando a base instalada tiver migrado.
  hive: ^2.2.3

  # Montagem de paths ciente de plataforma (Windows usa `\`; interpolar `/`
  # na mão corrompia a resolução de diretórios de storage).
  path: ^1.9.0

  # Wave 2 — fontes da identidade visual (Space Grotesk / Hanken Grotesk /
  # JetBrains Mono), servidas em runtime + cacheadas pelo google_fonts.
  google_fonts: ^6.2.1

  # Wave 2 — renderiza o Markdown (GFM + code) da resposta do agente.
  gpt_markdown: ^1.1.8

  # Wave 2 — notificações nativas do SO (agente terminou um turno).
  flutter_local_notifications: ^22.2.0

  # Wave 2 — esconde a barra nativa da janela (temos a customizada) e permite
  # arrastar/min/max pela nossa barra. macOS/Windows/Linux.
  window_manager: ^0.4.3

  # Wave 2 — aba de terminal: emulador (absorvido) + PTY nativo (plugin interno).
  # xterm foi ABSORVIDO como módulo interno em lib/app/core/terminal/xterm/
  # (2026-07-19): o upstream (TerminalStudio/xterm.dart) está parado, o projeto
  # já mantinha fork git + view/render forkados no repo, e o app importava
  # internals (src/). Emulador é Dart puro (zero nativo). Deps diretas do
  # vendor: quiver (+ meta via SDK).
  quiver: ^3.0.0
  # PTY nativo (ConPTY/forkpty) — plugin interno absorvido do fork
  # jacobaraujo7/kyroon_pty v1.0.6 (ver plugins/cockpit_pty/pubspec.yaml).
  cockpit_pty:
    path: plugins/cockpit_pty

  # Motor VT alternativo baseado no Ghostty. `libghostty` fornece os bindings
  # nativos e `flterm` a view Flutter oficial do mesmo repositório. Pins exatos:
  # ambos são pré-1.0 e mudam API em releases menores.
  libghostty: 0.0.11
  flterm: 0.0.4

  # Wave 2 — viewer de arquivo: renderiza SVG no pane (PNG/JPEG via Image.file).
  flutter_svg: ^2.0.10

  # Plano 46 — preview de áudio e vídeo no viewer (libmpv via media_kit): um
  # motor só cobre A/V, com aceleração de hardware, cross-platform. O
  # `media_kit_libs_video` embarca a libmpv em macOS/Windows; no Linux usamos a
  # do sistema (ver linux/packaging/*). NOTA: registrar no plano 46.
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4

  # Wave 2 — syntax highlight no viewer de texto. Port Dart do highlight.js; o
  # import default registra todas as 189 linguagens + aliases. Convertemos a
  # árvore de nós em TextSpan e pintamos com a paleta `SyntaxColors` do tema.
  # NOTA: registrar esta dep no plano 37 (responsabilidade do orquestrador).
  highlight: ^0.7.0

  # Wave 2 — colar imagem/arquivos do clipboard (Cmd/Ctrl+V) no composer. O
  # `Clipboard` do Flutter só lê texto; o pasteboard lê imagem (bytes) e paths.
  # NOTA: registrar esta dep no plano 37 (responsabilidade do orquestrador).
  pasteboard: ^0.4.0

  # Diretório de applicationSupport pra persistir o scrollback dos terminais
  # (replay após restart). Já vinha transitivo via Hive; promovido a dep direta.
  path_provider: ^2.1.0

  # Wave 2 — arrastar arquivos do SO (Finder/Explorer/etc.) pro input. O
  # drag-drop interno do Flutter não pega drops nativos; o desktop_drop cobre
  # macOS/Linux/Windows. NOTA: registrar esta dep no plano 37.
  desktop_drop: ^0.5.0

  # Wave 2 — header fixo (sticky) por turno no chat: a pergunta do usuário fica
  # pinada no topo enquanto a resposta rola. NOTA: registrar no plano 37.
  flutter_sticky_header: ^0.8.0

  # Conectividade (Fatia 3 — pareamento) — renderiza a URI de pareamento do
  # `remote-pi` como QR Code no dialog. NOTA: registrar esta dep no plano 37.
  qr_flutter: ^4.1.0

  # Windows-only — cliente de named pipe (Win32 FFI) pra falar com o supervisor,
  # que no Windows escuta em `\\.\pipe\…` em vez de UDS. Ver
  # lib/data/daemon/win_named_pipe.dart.
  ffi: ^2.1.0
  win32: ^5.5.0

  # Aviso de atualização in-app (plano 43, passo 7): versão atual do app
  # (package_info_plus) + abrir a URL do artefato no navegador (url_launcher).
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

  # Plano 47 — self-update nativo: Sparkle (macOS) + WinSparkle (Windows) via o
  # plugin federado auto_updater. No Linux é no-op (NoopSelfUpdater) e o caminho
  # de notify+download manual (UpdateChecker/UpdateCard) assume. O macOS embarca
  # o Sparkle.framework via CocoaPods; o Windows vendoriza a WinSparkle.dll.
  auto_updater: ^1.0.0

  # Plano 51 — drivers de banco da DB tab via anakiORM (conectores Rust/FFI;
  # SQLite + Postgres + MySQL + MSSQL). A FFI bloqueia → roda em Isolate
  # (AnakiDbDriver). Binários vêm por native assets do próprio pacote.
  #
  # Publicado no pub.dev com os fixes de native assets: binários no pacote
  # (#4), loader via asset-id (#6), build universal macOS corrigido (0.1.3 —
  # cada arch escreve no próprio outputDirectory, sem colisão no lipo).
  anaki_orm: ^0.1.1
  anaki_sqlite: ^0.1.4
  # Postgres 0.1.5 / MySQL 0.1.7: credenciais deixaram de ir por URL montada com
  # `format!` (agora Pg/MySqlConnectOptions programático). A URL crua quebrava
  # com senha contendo `? / #` — o sqlx reportava "invalid port number" — e
  # corrompia senha com `%` (percent-decode silencioso).
  anaki_postgres: ^0.1.5
  anaki_mysql: ^0.1.7
  anaki_mssql: ^0.1.4
  # NoSQL/cache — acesso APENAS via CLI por enquanto (sem UI); ver plano 51.
  anaki_redis: ^0.1.4
  # 0.1.5: feature `socks5-proxy` do crate mongodb habilitada (plano 54) — é o
  # que faz `proxyHost`/`proxyPort` valerem. Sem ela o driver recusa a opção, e
  # Mongo atrás de bastion (replica set / Atlas SRV) não tem caminho: o driver
  # descobre os membros pelo `hello` e disca os hostnames anunciados, furando
  # qualquer port-forward.
  anaki_mongodb: ^0.1.7

  # Plano 54 — túnel SSH opcional por conexão de banco. Dart puro de propósito
  # (decisão C): o binário `ssh` só *provavelmente* existe no Windows (Feature
  # on Demand removível), valida ACL da chave em vez de chmod e depende do
  # ssh-agent como serviço desligado por padrão. Custo assumido: não herdamos
  # `~/.ssh/config`, ProxyJump, known_hosts nem o agent.
  dartssh2: ^2.22.4

  # i18n (en default / pt-BR / es). `slang` (dev, abaixo) gera as classes
  # tipadas em lib/i18n/strings.g.dart a partir dos .i18n.json; `slang_flutter`
  # é o runtime (TranslationProvider, LocaleSettings, `t` global).
  slang_flutter: ^4.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # Usado só pelos testes vendorizados do emulador (core/terminal/xterm);
  # os .mocks.dart já vêm gerados — sem build_runner.
  mockito: ^5.4.0
  # Relógio virtual para testes com Timer (ex.: poll periódico do GitController).
  # Já vinha transitivo via flutter_test; declarado direto pra satisfazer o lint.
  fake_async: ^1.3.1
  # Codegen do i18n: lê lib/i18n/*.i18n.json (config em slang.yaml) e gera
  # lib/i18n/strings.g.dart. Rodar via `dart run slang`.
  slang: ^4.18.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Ícones de arquivo/pasta por extensão (material-icon-theme, MIT). O mapa
  # arquivo->ícone é gerado em lib/ui/core/file_icons/file_icon_map.g.dart.
  assets:
    - assets/file_icons/
    - assets/db_icons/
    - assets/sounds/
    - assets/branding/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
# TEMPORÁRIO — fork jacobaraujo7/libghostty (tag flterm-cockpit-2). Baseado no
# RELEASE v0.0.11 (nativo prebuilt de elias8, mesmo do pub) + 2 fixes: (1) scroll
# interno de TUI no Ghostty (wheel->mouse no alt-buffer) e (2) text input do
# Windows (#114). NÃO usa o dev-branch do fork (que tem compressão e exige um
# nativo mais novo, quebrando com dlsym 'ghostty_terminal_compression_activity').
# Público + HTTPS pra funcionar no macOS E no Windows. Voltar pro pub quando o
# upstream publicar os fixes.
dependency_overrides:
  # media_kit 1.2.6 chama `quit` em handles mpv antigos durante hot restart
  # antes de limpar o wakeup callback da isolate anterior, causando SIGABRT no
  # Flutter 3.38+ (`Callback invoked after it has been deleted`, upstream
  # #1314). O fix oficial foi mergeado em #1416, mas ainda não saiu no pub.dev.
  # Remover este override quando uma release posterior a 1.2.6 contiver o fix.
  media_kit:
    git:
      url: https://github.com/media-kit/media-kit.git
      ref: 44ba261
      path: media_kit
  # Pinados em TAG, não em branch nem em SHA de branch de dev. Consumir
  # `fix/flterm-tui-scroll-forwarding` deixava o app à mercê de qualquer push
  # na branch — foi assim que um terminal quebrado chegou aqui. Pinar o SHA
  # resolveu isso mas criou outro problema: revisão de PR reescreve a branch
  # (force-push) e o SHA vira commit órfão — some de todo clone frio, e o
  # release quebra em TODAS as plataformas no CI ("Could not find a file named
  # packages/libghostty/pubspec.yaml"), enquanto a máquina com pub-cache quente
  # segue compilando. Foi o que derrubou o cockpit-v1.15.1. Tag não move em
  # force-push, então é o único pin realmente imutável aqui.
  #
  # O commit do libghostty inclui o fix de isolamento do git no hook: sem ele, o
  # `source: compile` lia a tag do repo CONSUMIDOR (cockpit-vX.Y.Z), não batia
  # com o vX.Y.Z esperado pelo ghostty e abortava — quebrando todo release
  # tagueado. Upstream: elias8/libghostty#120 (785a21c = versão revisada do
  # mesmo fix, depois do force-push da revisão).
  #
  # Voltar pro pub.dev quando elias8/libghostty#119 e #120 forem merjados e
  # sair release.
  # Tag unificada (mesma ref para os dois pacotes) = upstream main + scroll.
  # Atualizada para o main atual do upstream: os fixes de IME (#126),
  # git-isolation (#120) e CPU baseline (#132) JA foram merjados upstream, entao
  # nao sao mais cherry-picks nossos; a ref agora e main + o unico pendente
  # (scroll de TUI, PR #119 ainda aberto). Traz tambem as novidades do main
  # (libghostty v0.0.12 / flterm v0.0.5, scrollback limits, notifications,
  # progress reports, upgrade do ffigen, fixes de iOS). ghostty.version novo
  # (4d605bf) recompila via source: compile (Zig 0.16.0, ja no CI).
  #
  # Quando #119 merjar e sair uma release contendo scroll + IME + CPU baseline,
  # trocar tudo isto por versoes do pub.dev e remover os overrides git.
  flterm:
    git:
      url: https://github.com/jacobaraujo7/libghostty.git
      ref: cockpit-pin-flterm-main-scroll
      path: packages/flterm
  libghostty:
    git:
      url: https://github.com/jacobaraujo7/libghostty.git
      ref: cockpit-pin-flterm-main-scroll
      path: packages/libghostty
