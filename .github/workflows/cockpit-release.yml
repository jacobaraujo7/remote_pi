# Release do Cockpit (plano 43, passo 3).
#
# Trigger: tag `cockpit-v<versão>` (a versão DEVE bater com o pubspec.yaml).
# Produz: GitHub Release com 6 artefatos + SHA256SUMS + latest.json.
# Publicação: o job final envia latest.json + appcasts direto pro rp-s3 via
# PUT /upload (Bearer RP_S3_UPLOAD_TOKEN) — ver rp-s3/README.md. Sem gate
# manual: a release vai ao ar assim que o workflow termina.
#
# Runbook por plataforma: cockpit/packaging/README.md.

name: cockpit-release

on:
  push:
    tags: ["cockpit-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex: cockpit-v1.0.0); precisa existir"
        required: true

permissions:
  contents: write

concurrency:
  group: cockpit-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  FLUTTER_VERSION: "3.44.4"

jobs:
  meta:
    name: Valida tag ↔ pubspec
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - id: v
        run: |
          VERSION="${RELEASE_TAG#cockpit-v}"
          FULL=$(grep '^version:' cockpit/pubspec.yaml | awk '{print $2}')
          PUBSPEC="${FULL%%+*}"
          BUILD="${FULL##*+}"
          if [ "$VERSION" != "$PUBSPEC" ]; then
            echo "::error::tag $RELEASE_TAG pede $VERSION mas o pubspec está em $PUBSPEC"
            exit 1
          fi
          # Plano 47: o Sparkle (macOS) compara CFBundleVersion (o +n). Sem build
          # number o self-update não detecta a versão nova — exigir +n explícito.
          if [ "$BUILD" = "$FULL" ] || [ -z "$BUILD" ]; then
            echo "::error::pubspec precisa de build number (ex: $VERSION+8) pro Sparkle comparar a versão"
            exit 1
          fi
          # As notas que o Sparkle mostra saem da PRIMEIRA seção `## ` do
          # CHANGELOG. Sem esta checagem, esquecer de escrever a seção da versão
          # publica silenciosamente a nota da versão ANTERIOR — foi o que
          # aconteceu de 1.15.4 até 1.18.1: releases seguidas exibindo o mesmo
          # texto. Falha aqui (segundos) em vez de depois dos builds.
          CHANGELOG_VERSION=$(awk '/^## /{print; exit}' cockpit/CHANGELOG.md \
            | sed -E 's/^## *\[?([0-9]+\.[0-9]+\.[0-9]+)\]?.*/\1/')
          if [ "$VERSION" != "$CHANGELOG_VERSION" ]; then
            echo "::error::CHANGELOG.md começa em '$CHANGELOG_VERSION' mas a release é $VERSION — escreva a seção ## [$VERSION] no topo (é dela que sai a nota do update)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  # Fatia x86_64 do cockpit-server (plano 58). `dart build cli` NÃO cross-compila,
  # e o runner do job macOS é Apple Silicon (arm64), então o bundle sairia
  # arm64-only e o Mac Intel cairia no fallback in-process (sem sidecar/host
  # remoto). Este job roda num runner Intel só pra produzir a fatia x64 do
  # bundle (leve: só `dart build cli` + a dylib do PTY, sem ghostty/Flutter app);
  # o job macOS funde as duas com `lipo`.
  server-x64:
    name: cockpit-server (fatia x86_64)
    needs: meta
    # macOS INTEL: o `dart build cli` não cross-compila, então a fatia x86_64
    # precisa de um runner Intel de verdade. O `macos-13` (último Intel gratuito)
    # foi RETIRADO em dez/2025 e o job ficava na fila para sempre — não falhava,
    # só nunca rodava, e o job macos (needs: server-x64) nunca começava.
    # `macos-15-intel` é o substituto oficial, último x86_64 do Actions,
    # disponível até ago/2027. Depois disso, a fatia Intel precisa de outra
    # estratégia (cross via Rosetta num runner ARM, ou abrir mão do Intel).
    runs-on: macos-15-intel
    defaults: { run: { working-directory: cockpit } }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Rust (native assets do anaki)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update || true
          rustup default stable
          cargo --version
      - name: Build do bundle x86_64
        run: |
          flutter pub get
          ./tool/build-sidecar.sh
          # Sanidade: o exe TEM que ser x86_64 (o runner é Intel). Se sair arm64
          # é sinal de dart/emulação errada — aborta antes de enganar o merge.
          # Checa TODO binário de bin/, não só o server: o lipo do job macos
          # exige a fatia x64 de cada um, e quando a CLI embarcada (bin/cockpit)
          # existia só do lado arm64 a release morria lá na frente, depois de
          # ~15min de build. Falhar aqui aponta o binário que faltou.
          for f in build/server-bundle/bin/*; do
            lipo -archs "$f"
            lipo -archs "$f" | grep -q x86_64 || {
              echo "::error::$(basename "$f") x64 saiu sem a fatia x86_64"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-server-x64
          path: cockpit/build/server-bundle
          retention-days: 1

  macos:
    name: macOS dmg (universal, notarizado)
    needs: [meta, server-x64]
    runs-on: macos-latest
    defaults: { run: { working-directory: cockpit } }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SIGN_ID: "Developer ID Application: Jacob Moura (U843T2P7A2)"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # O build hook do libghostty compila a dylib do ghostty (pubspec: hooks >
      # user_defines > libghostty > source: compile), o que exige Zig. Versão
      # FIXA de propósito — nunca master/latest: o ghostty declara
      # minimum_zig_version 0.16.0, e um floating aqui traria de volta a classe
      # de bug que o `compile` resolve (toolchain divergindo do que suportamos).
      # Quando o ghostty subir o mínimo, o job quebra alto e a gente atualiza.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # A CLI interna (`cockpit-cli`, crate em cockpit/cli) é compilada pelo
      # Run Script phase do Xcode como binário UNIVERSAL: o build_cli.sh gera
      # arm64 + x86_64 e junta com `lipo`. O mesmo build empacota uma CLI Linux
      # arm64 ao lado do cockpit-server cross-compiled para workspaces remotos.
      - name: Rust + targets macOS universal e Linux arm64
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin \
            aarch64-unknown-linux-gnu
          cargo --version

      - name: Baixa a fatia x86_64 do cockpit-server
        uses: actions/download-artifact@v4
        with:
          name: cockpit-server-x64
          path: cockpit/build/server-x64

      - name: Importa certificado Developer ID em keychain temporário
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build · sign · notarize · zip (Sparkle) · dmg
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          flutter pub get
          flutter build macos --release
          APP="build/macos/Build/Products/Release/Cockpit.app"
          # Funde a fatia x86_64 do cockpit-server (job server-x64) no bundle
          # arm64 do .app → universal. Reassina cada Mach-O fundido com o SIGN_ID
          # (lipo invalida a assinatura). Feito ANTES das assinaturas do app pra
          # o --deep/verify já verem o bundle universal e assinado.
          SERVER_BUNDLE="$APP/Contents/Resources/cockpit-server-bundle"
          # Merge sem assinar (o lipo invalida a assinatura de qualquer jeito);
          # a assinatura vem logo abaixo, com as entitlements certas.
          ./tool/lipo-server-bundle.sh "$SERVER_BUNDLE" build/server-x64
          # Reassina o bundle do servidor igual ao build_server.sh: as dylibs
          # primeiro; o exe (Dart AOT) com cockpit_hook.entitlements — sob
          # hardened runtime sem allow-jit o macOS o mata (mesma classe do
          # cockpit-hook/cli). O --deep abaixo não toca Mach-O solto em
          # Resources/, então esta assinatura é a que vale.
          for f in "$SERVER_BUNDLE"/lib/*.dylib; do
            codesign --force --options runtime --timestamp -s "$SIGN_ID" "$f"
          done
          # TODO binário de bin/, não só o cockpit-server: a CLI embarcada
          # (bin/cockpit, plano 60 Wave G1) entrou depois e ninguém a assinava.
          # O `--deep` do app NÃO alcança Mach-O em subpasta de Resources/, então
          # ela chegava crua na notarização e a reprovava com "not signed",
          # "no secure timestamp" e "hardened runtime not enabled".
          for f in "$SERVER_BUNDLE"/bin/*; do
            codesign --force --options runtime --timestamp \
              --entitlements macos/cockpit_hook.entitlements \
              --sign "$SIGN_ID" "$f"
          done
          # Gate do Intel (mesmo espírito do cockpit-cli): sem a fatia x86_64 o
          # sidecar/host remoto não sobem em Mac Intel. O exe do servidor é um
          # AOT do Dart e sai do lipo-server-bundle.sh como DOIS arquivos finos
          # (ver o cabeçalho do script: AOT do Dart não sobrevive ao lipo).
          for arch in arm64 x64; do
            exe="$SERVER_BUNDLE/bin/cockpit-server-$arch"
            [ -f "$exe" ] || {
              echo "::error::cockpit-server-$arch ausente no bundle"; exit 1; }
            want=$([ "$arch" = x64 ] && echo x86_64 || echo arm64)
            lipo -archs "$exe" | grep -q "$want" || {
              echo "::error::cockpit-server-$arch não é $want"; exit 1; }
          done
          # Gate do target enviado aos VMs de workspaces remotos. `file` prova
          # que server, PTY e CLI são ELF aarch64, e não Mach-O do cliente.
          LINUX_BUNDLE="$SERVER_BUNDLE/targets/linux-arm64"
          for f in "$LINUX_BUNDLE/bin/cockpit-server" \
                   "$LINUX_BUNDLE/bin/cockpit" \
                   "$LINUX_BUNDLE/lib/libcockpit_pty.so" \
                   "$LINUX_BUNDLE/lib/libanaki_mongodb.so" \
                   "$LINUX_BUNDLE/lib/libanaki_mssql.so" \
                   "$LINUX_BUNDLE/lib/libanaki_mysql.so" \
                   "$LINUX_BUNDLE/lib/libanaki_postgres.so" \
                   "$LINUX_BUNDLE/lib/libanaki_redis.so" \
                   "$LINUX_BUNDLE/lib/libanaki_sqlite.so"; do
            [ -f "$f" ] || { echo "::error::$f ausente"; exit 1; }
            file "$f" | grep -q 'ELF 64-bit.*ARM aarch64' || {
              echo "::error::$f não é Linux arm64"; file "$f"; exit 1; }
          done
          # Smoke test do binário assinado: sobe o servidor e exige o socket.
          # É o gate que faltava — o bundle universal da 1.28.0 passou por todas
          # as verificações estáticas e mesmo assim NENHUMA arquitetura rodava
          # ("is not an AOT snapshot"), deixando todo terminal no fallback.
          SMOKE="$RUNNER_TEMP/cockpit-server-smoke.sock"
          COCKPIT_PTY_DYLIB="$SERVER_BUNDLE/lib/libcockpit_pty.dylib" \
            "$SERVER_BUNDLE/bin/cockpit-server-arm64" \
            --socket "$SMOKE" --exit-on-idle 1 >"$RUNNER_TEMP/smoke.log" 2>&1 &
          for i in $(seq 1 20); do [ -S "$SMOKE" ] && break; sleep 0.5; done
          [ -S "$SMOKE" ] || {
            echo "::error::cockpit-server não subiu (bundle quebrado)"
            cat "$RUNNER_TEMP/smoke.log" || true
            exit 1
          }
          echo "[smoke] cockpit-server subiu e escutou em $SMOKE"
          # Assina o .app (Developer ID + Hardened Runtime + timestamp). --deep
          # cobre os componentes do Sparkle aninhados (Sparkle.framework,
          # Autoupdate, Updater.app, XPCServices), exigência da notarização.
          codesign --force --deep --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$SIGN_ID" "$APP"
          # O --deep reassinou o cockpit-hook (Contents/Resources) SEM as
          # entitlements dele. É um exe AOT do Dart: sob hardened runtime sem
          # allow-jit/allow-unsigned-executable-memory o macOS o mata (SIGKILL).
          # Reassina o helper com as entitlements certas e re-sela o topo do app
          # (sem --deep, pra não reassinar/estragar de novo o helper).
          codesign --force --options runtime --timestamp \
            --entitlements macos/cockpit_hook.entitlements \
            --sign "$SIGN_ID" "$APP/Contents/Resources/cockpit-hook"
          # Mesmo caso do cockpit-cli: exe AOT do Dart solto em Resources/. O
          # --deep NÃO assina Mach-O avulso em Resources/ (só trata code conhecido
          # — frameworks/plugins/XPC), então ele saía sem Developer ID, sem
          # timestamp e sem hardened runtime → notarização Invalid. Assina explícito.
          codesign --force --options runtime --timestamp \
            --entitlements macos/cockpit_hook.entitlements \
            --sign "$SIGN_ID" "$APP/Contents/Resources/cockpit-cli"
          codesign --force --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$SIGN_ID" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # O --deep --strict acima NÃO inspeciona Mach-O solto em subpasta de
          # Resources/ — foi assim que a CLI do bundle do servidor passou crua
          # daqui e só foi barrada pela Apple, 10 minutos depois. Verifica cada
          # um explicitamente, antes de gastar a submissão.
          for f in "$SERVER_BUNDLE"/bin/* "$SERVER_BUNDLE"/lib/*.dylib; do
            codesign --verify --strict --verbose=2 "$f" || {
              echo "::error::$(basename "$f") do bundle do servidor não passou na verificação de assinatura"
              exit 1
            }
          done
          # Gate do Intel: a CLI (que também atende os hooks do Claude via
          # `cockpit hook`) precisa das DUAS fatias. Checar a arquitetura não
          # basta — `lipo -verify_arch` passa até em binário quebrado —, então
          # também executamos a fatia nativa.
          lipo -archs "$APP/Contents/Resources/cockpit-cli"
          lipo -archs "$APP/Contents/Resources/cockpit-cli" | grep -q x86_64 || {
            echo "::error::cockpit-cli saiu sem a fatia x86_64 (Mac Intel ficaria sem CLI/hook)"
            exit 1
          }
          "$APP/Contents/Resources/cockpit-cli" --version
          mkdir -p dist
          echo "$APPLE_API_KEY" | base64 -d > "$RUNNER_TEMP/apikey.p8"
          notarize() {
            local out
            out=$(xcrun notarytool submit "$1" --key "$RUNNER_TEMP/apikey.p8" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait 2>&1)
            echo "$out"
            # Em rejeição (Invalid) o submit não traz os motivos; puxa o log com os
            # issues (arquivo + razão) pra diagnosticar sem caça manual.
            if echo "$out" | grep -q "status: Invalid"; then
              local id
              id=$(echo "$out" | grep -m1 -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}')
              echo "::error::Notarização Invalid — log da submissão $id:"
              xcrun notarytool log "$id" --key "$RUNNER_TEMP/apikey.p8" \
                --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" || true
              return 1
            fi
          }
          # 1) Notariza o .app (submetendo um zip) e grampeia o ticket no bundle.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize-app.zip"
          notarize "$RUNNER_TEMP/notarize-app.zip"
          xcrun stapler staple "$APP"
          # 2) Artefato de update do Sparkle (plano 47): zip do .app já
          #    notarizado+stapled — Sparkle troca o bundle in-place (zip é o
          #    caminho recomendado, não o dmg). NÃO entra no latest.json.
          ditto -c -k --keepParent "$APP" "dist/Cockpit-${VERSION}-macos.zip"
          # 3) DMG de primeira instalação, a partir do .app já stapled.
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          DMG="dist/RemotePiCockpit-${VERSION}-macos-universal.dmg"
          hdiutil create -volname "Remote Pi Cockpit" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          rm -rf "$STAGE"
          codesign --force --timestamp --sign "$SIGN_ID" "$DMG"
          notarize "$DMG"
          xcrun stapler staple "$DMG"
          spctl -a -t open --context context:primary-signature -vv "$DMG"
          rm "$RUNNER_TEMP/apikey.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          # dmg (primeira instalação) + Cockpit-<v>-macos.zip (update Sparkle).
          path: cockpit/dist/*
          if-no-files-found: error

  windows:
    name: Windows exe (x64, Inno Setup)
    needs: meta
    runs-on: windows-latest
    defaults: { run: { working-directory: cockpit, shell: bash } }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # O build hook do libghostty compila a dylib do ghostty (pubspec: hooks >
      # user_defines > libghostty > source: compile), o que exige Zig. Versão
      # FIXA de propósito — nunca master/latest: o ghostty declara
      # minimum_zig_version 0.16.0, e um floating aqui traria de volta a classe
      # de bug que o `compile` resolve (toolchain divergindo do que suportamos).
      # Quando o ghostty subir o mínimo, o job quebra alto e a gente atualiza.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Prepara Fastforge e Inno Setup
        run: |
          dart pub global activate fastforge
          echo "C:\\Program Files (x86)\\Inno Setup 6" >> "$GITHUB_PATH"

      - name: Build + empacota
        run: |
          flutter pub get
          flutter build windows --release
          # Gate do sidecar: sem o bundle do cockpit-server o app cai no
          # fallback in-process e o Windows roda uma arquitetura diferente do
          # macOS — silenciosamente, porque o fallback só escreve no log.
          SRV="build/windows/x64/runner/Release/cockpit-server-bundle/bin"
          test -x "$SRV/cockpit-server.exe" || {
            echo "::error::cockpit-server.exe ausente do bundle Windows"; exit 1; }
          test -f "$SRV/cockpit_pty.dll" || {
            echo "::error::cockpit_pty.dll ausente do bundle do servidor"; exit 1; }
          # Smoke test: sobe o servidor e exige o anúncio do endpoint. No
          # Windows o transporte é TCP de loopback + token num arquivo de
          # rendezvous (dart:io não tem socket UNIX lá) — era exatamente esse
          # bind que estourava, deixando TODO terminal do Windows no fallback
          # in-process depois de esperar o backoff do conector. O
          # --exit-on-idle encerra o processo sozinho, então o job não trava.
          ENDPOINT="$RUNNER_TEMP/cockpit-server-smoke.sock"
          "$SRV/cockpit-server.exe" --socket "$ENDPOINT" --exit-on-idle 1 \
            >"$RUNNER_TEMP/smoke.log" 2>&1 &
          for i in $(seq 1 20); do [ -f "$ENDPOINT" ] && break; sleep 0.5; done
          test -f "$ENDPOINT" || {
            echo "::error::cockpit-server não subiu no Windows"
            cat "$RUNNER_TEMP/smoke.log" || true
            exit 1
          }
          grep -q '"port"' "$ENDPOINT" || {
            echo "::error::anúncio do endpoint sem porta: $(cat "$ENDPOINT")"
            exit 1
          }
          echo "[smoke] cockpit-server anunciou o endpoint: $(cat "$ENDPOINT")"
          dart pub global run fastforge:main package --platform windows --targets exe
          EXE=$(find dist -name "*.exe" | head -1)
          test -n "$EXE"
          mkdir -p out
          mv "$EXE" "out/RemotePiCockpit-Setup-${VERSION}-windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: cockpit/out/*.exe
          if-no-files-found: error

  linux:
    name: Linux deb+rpm (${{ matrix.deb_arch }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            deb_arch: amd64
            rpm_arch: x86_64
          - runner: ubuntu-24.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    # Rede de segurança: sem teto o default do GitHub é SEIS HORAS. Na 1.28.1
    # um `apt-get` pendurado segurou o job por 47min (o normal é ~1min) sem
    # nada acusar; a release só andou porque alguém foi olhar. Os tetos abaixo
    # transformam "pendurado indefinidamente" em "falha alto, com log, e
    # `gh run rerun --failed` refaz só este job".
    timeout-minutes: 45
    defaults: { run: { working-directory: cockpit } }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Flutter x64 (SDK empacotado)
        if: matrix.deb_arch == 'amd64'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Não existe SDK empacotado de Flutter pra linux-arm64 (flutter-action
      # falha em host ARM). O caminho suportado é rodar a partir do git: o
      # tool se bootstrapa e baixa os artefatos de engine arm64.
      - name: Flutter arm64 (via git)
        if: matrix.deb_arch == 'arm64'
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      # O build hook do libghostty compila a dylib do ghostty (pubspec: hooks >
      # user_defines > libghostty > source: compile), o que exige Zig. Versão
      # FIXA de propósito — nunca master/latest: o ghostty declara
      # minimum_zig_version 0.16.0, e um floating aqui traria de volta a classe
      # de bug que o `compile` resolve (toolchain divergindo do que suportamos).
      # Quando o ghostty subir o mínimo, o job quebra alto e a gente atualiza.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Deps de sistema (GTK, ninja, rpmbuild, libmpv)
        # Medido: 55s no amd64, 1m08s no arm64. Passar de 10min aqui não é
        # lentidão, é pendura — lista de pacotes fixa, nada a compilar.
        timeout-minutes: 10
        env:
          # `needrestart` do ubuntu-24.04 abre prompt interativo no install e
          # é uma das formas clássicas de pendurar o passo.
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Stall de mirror costuma passar na segunda tentativa; três, com
          # teto por tentativa, custam nada perto de um rerun manual. Falha nas
          # três aborta AQUI: seguir pro install com o índice velho troca um
          # erro claro por um "pacote não encontrado" mais adiante.
          updated=0
          for attempt in 1 2 3; do
            if timeout 120 sudo -E apt-get update; then updated=1; break; fi
            echo "apt-get update falhou/expirou (tentativa $attempt)"
            sleep 5
          done
          [ "$updated" = 1 ] || {
            echo "::error::apt-get update falhou nas 3 tentativas (mirror?)"
            exit 1
          }
          # libmpv-dev: media_kit linka contra libmpv no Linux (plano 46).
          # Runtime declarado nos pacotes: deb libmpv2 / rpm mpv-libs.
          # libsecret-1-dev: flutter_secure_storage no Linux (senha de banco,
          # plano 51). Runtime: libsecret-1-0.
          sudo -E apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev rpm libmpv-dev libsecret-1-dev
          flutter --version
          dart pub global activate fastforge

      - name: Build + empacota
        # Medido: 7m19s. Teto folgado de propósito — aqui se compila Flutter,
        # o `dart build cli`, o Rust da CLI e o Zig do libghostty, e cache frio
        # infla isso legitimamente.
        timeout-minutes: 30
        run: |
          flutter pub get
          flutter build linux --release
          # Gate do sidecar (mesma razão do Windows): sem o bundle do
          # cockpit-server o app cai no fallback in-process, em silêncio.
          SRV="build/linux/${{ matrix.deb_arch == 'amd64' && 'x64' || 'arm64' }}/release/bundle/cockpit-server-bundle/bin"
          test -x "$SRV/cockpit-server" || {
            echo "::error::cockpit-server ausente do bundle Linux ($SRV)"; exit 1; }
          test -f "$SRV/libcockpit_pty.so" || {
            echo "::error::libcockpit_pty.so ausente do bundle do servidor"; exit 1; }
          # Smoke test: sobe o servidor e exige o socket. Existir e ser
          # executável não prova que roda — no macOS um bundle que passava em
          # toda checagem estática não subia em arquitetura nenhuma, e o app
          # caía no PTY in-process em silêncio. O --exit-on-idle encerra
          # sozinho, então o job não trava.
          SOCK="$RUNNER_TEMP/cockpit-server-smoke.sock"
          COCKPIT_PTY_DYLIB="$SRV/libcockpit_pty.so" \
            "$SRV/cockpit-server" --socket "$SOCK" --exit-on-idle 1 \
            >"$RUNNER_TEMP/smoke.log" 2>&1 &
          for i in $(seq 1 20); do [ -S "$SOCK" ] && break; sleep 0.5; done
          [ -S "$SOCK" ] || {
            echo "::error::cockpit-server não subiu no Linux"
            cat "$RUNNER_TEMP/smoke.log" || true
            exit 1
          }
          echo "[smoke] cockpit-server subiu e escutou em $SOCK"
          dart pub global run fastforge:main package --platform linux --targets deb
          dart pub global run fastforge:main package --platform linux --targets rpm
          DEB=$(find dist -name "*.deb" | head -1); test -n "$DEB"
          RPM=$(find dist -name "*.rpm" | head -1); test -n "$RPM"
          mkdir -p out
          mv "$DEB" "out/remote-pi-cockpit_${VERSION}_${{ matrix.deb_arch }}.deb"
          mv "$RPM" "out/remote-pi-cockpit-${VERSION}.${{ matrix.rpm_arch }}.rpm"

      - name: Smoke test .deb (instala no próprio runner)
        # Medido: 6s. O smoke sobe o servidor e espera o socket com laço
        # próprio, então um teto curto aqui é seguro.
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get install -y "./out/remote-pi-cockpit_${VERSION}_${{ matrix.deb_arch }}.deb"
          dpkg -L remote-pi-cockpit | grep -m1 "\.desktop$"
          # O bundle do servidor chegou ao PACOTE (o gate anterior só provou que
          # saiu do build). Sem ele o app instalado roda no fallback.
          dpkg -L remote-pi-cockpit | grep -q "cockpit-server-bundle/bin/cockpit-server$" || {
            echo "::error::.deb sem o bundle do cockpit-server"; exit 1; }
          # E o binário INSTALADO sobe de fato: é a única checagem que exercita
          # o caminho real (prefixo de instalação, permissões, rpath das libs
          # ao lado). O gate anterior só provou que o arquivo está no pacote.
          INSTALLED=$(dpkg -L remote-pi-cockpit | grep -m1 "cockpit-server-bundle/bin/cockpit-server$")
          SOCK="$RUNNER_TEMP/cockpit-server-deb.sock"
          "$INSTALLED" --socket "$SOCK" --exit-on-idle 1 \
            >"$RUNNER_TEMP/deb-smoke.log" 2>&1 &
          for i in $(seq 1 20); do [ -S "$SOCK" ] && break; sleep 0.5; done
          [ -S "$SOCK" ] || {
            echo "::error::cockpit-server instalado pelo .deb não sobe"
            cat "$RUNNER_TEMP/deb-smoke.log" || true
            exit 1
          }
          echo "[smoke] cockpit-server do .deb subiu em $SOCK"

      - name: Smoke test .rpm (container fedora:40)
        # Medido: 37s. A folga cobre o pull da imagem num dia ruim de rede.
        timeout-minutes: 10
        run: |
          # rpm -qpl consulta o ARQUIVO (o nome interno do pacote não é
          # remote-pi-cockpit — o maker do Fastforge usa o nome do pubspec).
          docker run --rm -v "$PWD/out:/out:ro" fedora:40 bash -c \
            "dnf install -y /out/remote-pi-cockpit-${VERSION}.${{ matrix.rpm_arch }}.rpm \
             && rpm -qpl /out/remote-pi-cockpit-${VERSION}.${{ matrix.rpm_arch }}.rpm | grep -m1 '\.desktop$'"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.deb_arch }}
          path: cockpit/out/*
          if-no-files-found: error

  publish:
    name: GitHub Release + latest.json
    needs: [meta, macos, windows, linux]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      # O download traz TODOS os artefatos do run, inclusive o
      # `cockpit-server-x64` — que é INSUMO do job macos (a fatia Intel pro
      # lipo), não entregável, e chega como os diretórios bin/ e lib/. Cada
      # passo seguinte tropeçava neles por conta própria: `sha256sum` com "Is a
      # directory" e o `gh release upload` tentando subir um diretório como
      # asset. Some com eles aqui, uma vez, em vez de remendar passo a passo.
      - name: Descarta insumos (só entregáveis viram asset)
        run: |
          find release -mindepth 1 -maxdepth 1 -type d -print -exec rm -rf {} +
          ls -la release

      - name: Gera SHA256SUMS e latest.json
        run: |
          cd release
          # Só ARQUIVOS: o artefato `cockpit-server-x64` (insumo do job macos, não
          # entregável) vem como os diretórios bin/ e lib/, e `sha256sum *`
          # falhava com "Is a directory" — derrubando o job inteiro sob `bash -e`
          # depois de todo o build já ter passado.
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | xargs -0 sha256sum > SHA256SUMS
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          : > artifacts.ndjson
          for f in *; do
            [ -f "$f" ] || continue   # pula bin/ e lib/ do artefato do servidor
            case "$f" in
              *macos-universal.dmg) p=macos   a=universal fmt=dmg ;;
              *windows-x64.exe)     p=windows a=x64       fmt=exe ;;
              *_amd64.deb)          p=linux   a=x64       fmt=deb ;;
              *_arm64.deb)          p=linux   a=arm64     fmt=deb ;;
              *.x86_64.rpm)         p=linux   a=x64       fmt=rpm ;;
              *.aarch64.rpm)        p=linux   a=arm64     fmt=rpm ;;
              *) continue ;;
            esac
            jq -n --arg platform "$p" --arg arch "$a" --arg format "$fmt" \
              --arg url "$BASE/$f" \
              --arg sha256 "$(sha256sum "$f" | cut -d' ' -f1)" \
              --argjson size "$(stat -c%s "$f")" \
              '{platform:$platform, arch:$arch, format:$format, url:$url, sha256:$sha256, size:$size}' \
              >> artifacts.ndjson
          done
          COUNT=$(jq -s length artifacts.ndjson)
          if [ "$COUNT" -ne 6 ]; then
            echo "::error::esperava 6 artefatos no manifest, achei $COUNT"
            exit 1
          fi
          # Notas: primeira seção do CHANGELOG; fallback genérico. O markdown
          # CRU (com as linhas em branco) vai pro RUNNER_TEMP — é o que o passo
          # do appcast converte pra HTML. O `notes` do latest.json segue como
          # está (o site renderiza esse campo como texto).
          awk '/^## /{n++} n==1' ../cockpit/CHANGELOG.md | tail -n +2 \
            > "$RUNNER_TEMP/notes.md"
          NOTES=$(sed '/^$/d' "$RUNNER_TEMP/notes.md" | head -20)
          if [ -z "$NOTES" ]; then
            NOTES="Remote Pi Cockpit ${VERSION}"
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          fi
          jq -n --arg version "$VERSION" --arg date "$(date -u +%F)" \
            --arg notes "$NOTES" --slurpfile artifacts artifacts.ndjson \
            '{version:$version, date:$date, notes:$notes, artifacts:$artifacts}' \
            > latest.json
          rm artifacts.ndjson
          cat latest.json

      - name: Assina artefatos e gera appcasts (Sparkle/WinSparkle)
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          BUILD: ${{ needs.meta.outputs.build }}
        run: |
          # Plano 47 — assina o .app.zip (macOS) e o .exe (Windows) com a MESMA
          # chave ed25519 (decisão E refinada): ed25519 é determinístico, então
          # PyNaCl gera a assinatura que Sparkle e WinSparkle verificam. Sem
          # ferramenta nativa nos runners — só a chave (secret).
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pynacl
          cat > "$RUNNER_TEMP/sign.py" <<'PY'
          import base64, os, sys
          from nacl.signing import SigningKey
          seed = base64.b64decode(os.environ['SPARKLE_PRIVATE_KEY'].strip())
          data = open(sys.argv[1], 'rb').read()
          print(base64.b64encode(SigningKey(seed).sign(data).signature).decode())
          PY
          sign() { "$RUNNER_TEMP/venv/bin/python3" "$RUNNER_TEMP/sign.py" "$1"; }
          cd release
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          ZIP="Cockpit-${VERSION}-macos.zip"
          EXE="RemotePiCockpit-Setup-${VERSION}-windows-x64.exe"
          test -f "$ZIP"; test -f "$EXE"
          MAC_SIG=$(sign "$ZIP"); MAC_LEN=$(stat -c%s "$ZIP")
          WIN_SIG=$(sign "$EXE"); WIN_LEN=$(stat -c%s "$EXE")
          PUBDATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")
          # O Sparkle/WinSparkle renderiza a <description> como HTML num webview.
          # Jogar o markdown do CHANGELOG lá dentro fazia o usuário ver os `###`
          # e `**` na tela e, pior, TUDO numa linha só (HTML colapsa quebras de
          # linha) — ilegível. Converte pra HTML de verdade antes.
          python3 ../cockpit/packaging/release_notes_html.py --selftest
          python3 ../cockpit/packaging/release_notes_html.py \
            < "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/notes.html"
          # macOS: sparkle:version = CFBundleVersion (build +n); shortVersion = marketing.
          cat > appcast-macos.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Remote Pi Cockpit</title>
              <item>
                <title>${VERSION}</title>
                <pubDate>${PUBDATE}</pubDate>
                <sparkle:version>${BUILD}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>10.15.0</sparkle:minimumSystemVersion>
                <description><![CDATA[@@NOTES@@]]></description>
                <enclosure url="${BASE}/${ZIP}" sparkle:edSignature="${MAC_SIG}" length="${MAC_LEN}" type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          XML
          # Windows: WinSparkle baixa o .exe do Inno e roda silencioso via
          # sparkle:installerArguments; sparkle:version = versão marketing (bate
          # com o ProductVersion do Runner.rc).
          cat > appcast-windows.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Remote Pi Cockpit</title>
              <item>
                <title>${VERSION}</title>
                <pubDate>${PUBDATE}</pubDate>
                <sparkle:version>${VERSION}</sparkle:version>
                <description><![CDATA[@@NOTES@@]]></description>
                <enclosure url="${BASE}/${EXE}" sparkle:edSignature="${WIN_SIG}" length="${WIN_LEN}" sparkle:os="windows" sparkle:installerArguments="/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          XML
          # Injeta o HTML por substituição (não por expansão do heredoc): as
          # notas são texto livre e um `$(`, uma crase ou um `]]>` no CHANGELOG
          # quebrariam o shell ou o CDATA.
          python3 - "$RUNNER_TEMP/notes.html" appcast-macos.xml appcast-windows.xml <<'PY'
          import sys
          notes = open(sys.argv[1], encoding='utf-8').read().replace(']]>', ']]&gt;')
          for path in sys.argv[2:]:
              with open(path, encoding='utf-8') as f:
                  xml = f.read()
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(xml.replace('@@NOTES@@', notes))
          PY
          if grep -q '@@NOTES@@' appcast-macos.xml appcast-windows.xml; then
            echo "::error::notas não injetadas no appcast (placeholder sobrou)"
            exit 1
          fi
          echo "== appcast-macos.xml =="; cat appcast-macos.xml
          echo "== appcast-windows.xml =="; cat appcast-windows.xml

      - name: Cria (ou atualiza) a GitHub Release
        run: |
          NOTES_FILE=$(mktemp)
          jq -r .notes release/latest.json > "$NOTES_FILE"
          {
            echo ""
            echo "---"
            echo "**Publicação:** \`latest.json\` + appcasts são enviados automaticamente"
            echo "pro rp-s3 no fim do workflow (liga site/card e o self-update"
            echo "Sparkle/WinSparkle). Se o passo de publish falhar, o fallback manual"
            echo "é baixar os 3 arquivos desta release e colocar em"
            echo "\`/Users/flutterando/cockpit/data/\` (ver \`rp-s3/README.md\`)."
          } >> "$NOTES_FILE"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --title "Remote Pi Cockpit ${VERSION}" \
              --notes-file "$NOTES_FILE" \
              --latest
          fi
          # O badge "Latest" também no re-run (ali em cima só o create passa a
          # flag). Idempotente.
          #
          # O repositório publica DUAS linhas de release (cockpit-v* e app-v*) e
          # o GitHub só tem um "Latest" — a flag era `false` nas duas, herdada
          # do workflow do app, e sobrava marcar na mão a cada release. O
          # Cockpit fica com o badge por ser a linha ativa; o app mobile, raro,
          # segue sem. Nada no projeto depende da URL /releases/latest (os
          # downloads vão pelo latest.json do rp-s3 e pelos appcasts), então
          # isto é cosmético — e o cosmético estava dando trabalho manual.
          gh release edit "$RELEASE_TAG" --latest

      # Publica os manifests no rp-s3 (substitui o gate manual). Roda DEPOIS da
      # release existir no GitHub: as URLs dentro do latest.json/appcasts apontam
      # pros assets da release, então só faz sentido publicar com eles no ar.
      # Appcasts primeiro, latest.json por último: o site/card só anuncia a
      # versão quando o self-update já tem o que servir.
      - name: Publica manifests no rp-s3
        env:
          RP_S3_UPLOAD_TOKEN: ${{ secrets.RP_S3_UPLOAD_TOKEN }}
        run: |
          upload() {
            curl -fsS --retry 3 --retry-delay 5 -X PUT \
              -H "Authorization: Bearer ${RP_S3_UPLOAD_TOKEN}" \
              --data-binary "@release/$1" \
              "https://rp-s3.jacobmoura.work/upload/cockpit/$1"
          }
          upload appcast-macos.xml
          upload appcast-windows.xml
          upload SHA256SUMS
          upload latest.json
          echo "publicado: https://rp-s3.jacobmoura.work/downloads/cockpit/latest.json"

      - name: Resumo
        run: |
          {
            echo "## Cockpit ${VERSION} publicado"
            echo ""
            echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo ""
            echo "Manifests publicados automaticamente no rp-s3:"
            echo "- https://rp-s3.jacobmoura.work/downloads/cockpit/latest.json"
            echo "- https://rp-s3.jacobmoura.work/downloads/cockpit/appcast-macos.xml"
            echo "- https://rp-s3.jacobmoura.work/downloads/cockpit/appcast-windows.xml"
          } >> "$GITHUB_STEP_SUMMARY"
