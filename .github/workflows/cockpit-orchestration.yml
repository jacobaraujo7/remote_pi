name: cockpit-orchestration

on:
  pull_request:
    paths:
      - 'cockpit/lib/**'
      - 'cockpit/test/**'
      - 'cockpit/tool/design/**'
      - 'cockpit/pubspec.*'
      - 'cockpit/packages/**'
      - 'cockpit/cli/**'
      - 'cockpit/windows/**'
      - 'cockpit/macos/**'
      - '.github/workflows/cockpit-orchestration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orchestration-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cockpit

env:
  FLUTTER_VERSION: '3.50.0-0.1.pre'

jobs:
  native-validation:
    name: Orchestration / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: beta
          cache: true
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Rust build prerequisites
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          if [ "${{ runner.os }}" = "macOS" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu
          fi
      - name: Resolve versioned dependencies
        run: flutter pub get
      - name: CLI caller routing contract
        run: cargo test --manifest-path cli/Cargo.toml
      - name: Analyze workspace presentation
        run: >-
          flutter analyze --no-pub
          lib/main.dart
          lib/app/cockpit/domain/services/worktree_reconciler.dart
          lib/app/cockpit/domain/utils/coalescing_single_flight.dart
          lib/app/bootstrapper.dart
          lib/app/cockpit/domain/entities/orchestration_presentation.dart
          lib/app/cockpit/domain/entities/orchestration_document.dart
          lib/app/cockpit/domain/entities/terminal_owner.dart
          lib/app/cockpit/ui/viewmodels/orchestration_multiplexer.dart
          lib/app/cockpit/ui/viewmodels/orchestration_context.dart
          lib/app/cockpit/ui/viewmodels/orchestration_cli_handler.dart
          lib/app/cockpit/ui/viewmodels/cockpit_cli_handler.dart
          lib/app/cockpit/ui/viewmodels/telemetry_cli_handler.dart
          lib/app/cockpit/data/telemetry
          lib/app/cockpit/domain/contracts/telemetry_ingest.dart
          lib/app/cockpit/domain/entities/telemetry_event.dart
          lib/app/cockpit/data/hooks/terminal_status_server_impl.dart
          lib/app/cockpit/data/hooks/hook_installer_base.dart
          lib/app/core/data/setup/remote_pi_resolver.dart
          lib/app/core/data/setup/storage_location.dart
          lib/app/core/data/process/owned_process_registry.dart
          lib/app/core/data/lsp/lsp_process_registry.dart
          lib/app/cockpit/ui/document/running_instance.dart
          lib/app/cockpit/ui/services/orchestration_document_files.dart
          lib/app/cockpit/ui/session/orchestration_file_presentation.dart
          lib/app/cockpit/ui/widgets/orchestration_document_area.dart
          lib/app/cockpit/ui/document/native_document_router.dart
          lib/app/cockpit/ui/document/open_files_channel.dart
          lib/app/cockpit/ui/document/worktree_document_host.dart
          lib/app/cockpit/ui/document/document_window_app.dart
          lib/app/cockpit/ui/widgets/file_viewer.dart
          lib/app/cockpit/ui/widgets/layout_preview_view.dart
          lib/app/core/ui/menu/editor_menu_bridge.dart
          lib/app/cockpit/ui/document/standalone_document_host.dart
          lib/app/cockpit/data/filesystem/file_reader_impl.dart
          lib/app/cockpit/data/terminal/sidecar/sidecar_terminal_connector.dart
          lib/app/cockpit/ui/widgets/orchestration_terminals_view.dart
          lib/app/cockpit/ui/viewmodels/workspace_graph_context.dart
          lib/app/cockpit/ui/viewmodels/session_notifications_controller.dart
          lib/app/cockpit/ui/widgets/terminal_session_view.dart
          lib/app/cockpit/ui/widgets/adaptive_terminal_pane.dart
          lib/app/cockpit/ui/actions/tab_actions.dart
          lib/app/cockpit/ui/services/orchestration_controller.dart
          lib/app/cockpit/ui/services/layout_scrollback_keys.dart
          lib/app/cockpit/ui/services/orchestration_restore_state.dart
          lib/app/cockpit/ui/services/orchestration_ownership_migration.dart
          lib/app/cockpit/data/repositories/json_workspace_layout_store.dart
          lib/app/cockpit/ui/services/orchestration_terminal_target.dart
          lib/app/cockpit/ui/viewmodels/orchestration_workspace.dart
          lib/app/cockpit/ui/widgets/orchestration_view.dart
          lib/app/cockpit/ui/session/orchestration_session.dart
          lib/app/cockpit/domain/entities/workspace_graph.dart
          lib/app/cockpit/ui/session/terminal_session.dart
          lib/app/cockpit/ui/widgets/workspace_graph_view.dart
          lib/app/cockpit/ui/widgets/stable_pane_host.dart
          lib/app/cockpit/ui/widgets/stable_tab_stack.dart
          lib/app/cockpit/ui/widgets/workspace_box_list.dart
          lib/app/cockpit/ui/widgets/workspace_box_inspector.dart
          lib/app/cockpit/ui/widgets/gallery_panel.dart
          lib/app/cockpit/ui/widgets/cockpit_topbar.dart
          lib/app/cockpit/ui/widgets/pane_view.dart
          lib/app/cockpit/ui/cockpit_page.dart
          lib/app/cockpit/ui/viewmodels/cockpit_viewmodel.dart
          lib/app/cockpit/ui/viewmodels/file_ops_controller.dart
      - name: Native terminal lifecycle and workspace regressions
        run: >-
          flutter test --no-pub
          test/domain/coalescing_single_flight_test.dart
          test/domain/worktree_reconciler_test.dart
          test/domain/orchestration_document_test.dart
          test/ui/orchestration_controller_test.dart
          test/ui/file_tree_panel_test.dart
          test/ui/layout_scrollback_keys_test.dart
          test/ui/orchestration_restore_state_test.dart
          test/ui/orchestration_ownership_migration_test.dart
          test/core/data/json_stores_test.dart
          test/ui/orchestration_multiplexer_test.dart
          test/ui/orchestration_context_test.dart
          test/ui/orchestration_cli_handler_test.dart
          test/data/terminal_status_server_command_test.dart
          test/data/isolated_hook_installation_test.dart
          test/data/sidecar_server_binary_test.dart
          test/core/data/cockpit_runtime_namespace_test.dart
          test/core/data/storage_location_test.dart
          test/core/process/owned_process_registry_test.dart
          test/ui/orchestration_session_test.dart
          test/session/file_ops_import_test.dart
          test/ui/orchestration_document_files_test.dart
          test/ui/native_document_router_test.dart
          test/ui/open_files_channel_test.dart
          test/ui/worktree_document_host_test.dart
          test/ui/scoped_document_screen_test.dart
          test/ui/layout_preview_view_test.dart
          test/ui/standalone_document_host_test.dart
          test/data/file_reader_impl_test.dart
          test/ui/orchestration_terminals_view_test.dart
          test/ui/session_notifications_controller_test.dart
          test/ui/terminal_session_view_test.dart
          test/ui/orchestration_live_sessions_test.dart
          test/ui/neovim_settings_viewmodel_test.dart
          test/ui/agent_role_suggestion_service_test.dart
          test/ui/orchestration_terminal_target_test.dart
          test/domain/gallery_template_test.dart
          test/ui/gallery_panel_test.dart
          test/domain/workspace_graph_test.dart
          test/domain/graph_subagent_wire_test.dart
          test/ui/stable_pane_host_test.dart
          test/ui/stable_terminal_views_test.dart
          test/ui/terminal_dock_lifecycle_test.dart
          test/ui/workspace_box_list_test.dart
          test/ui/workspace_box_inspector_test.dart
          test/ui/graph_telemetry_service_test.dart
          test/data/telemetry/app_telemetry_bridge_test.dart
          test/data/telemetry/otlp_and_config_test.dart
          test/data/telemetry/telemetry_store_registry_test.dart
          test/data/telemetry/telemetry_cli_handler_test.dart
          test/data/telemetry/telemetry_ingest_test.dart
          test/data/telemetry/telemetry_line_parser_test.dart
          test/tasks/watch_match_test.dart
          test/ui/graph_process_metrics_service_test.dart
          test/ui/claude_graph_identity_resolver_test.dart
          test/session/terminal_attachments_test.dart
          test/ui/terminal_attachment_drop_target_test.dart
          test/ui/terminal_attachment_shortcuts_test.dart
          test/session/terminal_status_test.dart
          tool/design/render_orchestration_layouts_test.dart
      # Preserve the existing 10k/<1000ms gate without parallel compiler/test contention.
      - name: SQLite correctness and isolated 10k benchmark
        run: >-
          flutter test --no-pub --concurrency=1
          test/data/telemetry/sqlite_telemetry_store_test.dart
      - name: Resolve server regression dependencies
        working-directory: cockpit/packages/cockpit_server
        run: dart pub get
      - name: Server routing, transport and native file creation
        working-directory: cockpit/packages/cockpit_server
        run: >-
          dart test
          test/exclusive_file_create_test.dart
          test/local_transport_test.dart
          test/cli_forward_test.dart
          ../cockpit_engine/test/native_file_create_test.dart
      - name: Build Windows app
        if: runner.os == 'Windows'
        run: flutter build windows --debug --no-pub
      - name: Windows native forwarding argument round-trips
        if: runner.os == 'Windows'
        run: |
          cmake --build build/windows/x64 --config Debug --target native_open_forwarder_test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows/x64/native_tests/Debug/native_open_forwarder_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build macOS app without release publishing
        if: runner.os == 'macOS'
        shell: bash
        run: |
          flutter build macos --debug --no-pub --config-only
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner \
            -configuration Debug -derivedDataPath build/macos \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO build
